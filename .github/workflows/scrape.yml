name: Job Scraper — Every Hour

on:
  schedule:
    - cron: '0 * * * *'   # runs at the top of every hour
  workflow_dispatch:        # lets you trigger manually from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_scraper.py

      - name: Commit and push updated files
        run: |
          git config --global user.name "Job Scraper Bot"
          git config --global user.email "bot@github.com"

          # Stage always-present/generated history files.
          git add README.md seen_links.csv *-Jobs-List.md || true

          # Stage optional v3 outputs only when they exist.
          for f in mass_hiring_signals.csv MASS-HIRING-WATCH.md source_health.csv; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          # Commit local scraper output first.
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Job update — $(date +'%Y-%m-%d %H:%M')"
          fi

          # The branch may have advanced since checkout (for example another hourly run
          # or a manual code/config update). Rebase before pushing to avoid non-fast-forward.
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
