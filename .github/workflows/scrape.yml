name: Job Scraper — Every Hour

on:
  schedule:
    - cron: '17 * * * *'  # primary GitHub scheduler run
    - cron: '47 * * * *'  # fallback GitHub scheduler run
  workflow_dispatch:        # lets you trigger manually from GitHub UI
  repository_dispatch:
    types: [hourly-scrape]  # external scheduler trigger
  push:
    branches:
      - main
    paths:
      - 'job_scraper.py'
      - 'official_sources.py'
      - 'run_scraper.py'
      - 'cleanup_opendoor_batch.py'
      - 'resume_tailor.py'
      - 'resume_builder.py'
      - 'resume_portal_feed.py'
      - 'resume_skill_inventory.json'
      - 'resume_master_schema.example.json'
      - 'RESUME_TAILOR.md'
      - 'RESUME_BUILDER.md'
      - 'RESUME_PORTAL.md'
      - 'portal/**'
      - 'companies.csv'
      - 'official_companies.csv'
      - 'requirements.txt'
      - 'test_job_scraper.py'
      - 'test_official_sources.py'
      - 'test_resume_tailor.py'
      - 'test_resume_builder.py'
      - 'test_resume_portal.py'
      - 'SETUP.md'
      - '.github/workflows/scrape.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'job_scraper.py'
      - 'official_sources.py'
      - 'run_scraper.py'
      - 'cleanup_opendoor_batch.py'
      - 'resume_tailor.py'
      - 'resume_builder.py'
      - 'resume_portal_feed.py'
      - 'resume_skill_inventory.json'
      - 'resume_master_schema.example.json'
      - 'RESUME_TAILOR.md'
      - 'RESUME_BUILDER.md'
      - 'RESUME_PORTAL.md'
      - 'portal/**'
      - 'companies.csv'
      - 'official_companies.csv'
      - 'requirements.txt'
      - 'test_job_scraper.py'
      - 'test_official_sources.py'
      - 'test_resume_tailor.py'
      - 'test_resume_builder.py'
      - 'test_resume_portal.py'
      - 'SETUP.md'
      - '.github/workflows/scrape.yml'

concurrency:
  group: job-scraper-main
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest -v test_job_scraper.py test_official_sources.py test_resume_tailor.py test_resume_builder.py test_resume_portal.py

      - name: Set up Node for portal validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate browser portal build
        run: |
          npm install --prefix portal --ignore-scripts --no-audit --no-fund
          ./portal/node_modules/.bin/esbuild portal/app.js \
            --bundle \
            --platform=browser \
            --format=iife \
            --target=es2020 \
            --outfile=/tmp/resume-portal.js

      - name: Run scraper
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_scraper.py

      - name: Keep only the latest 7 days of job-list Markdown
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          from datetime import date, datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import re

          today = datetime.now(ZoneInfo('America/Phoenix')).date()
          keep_days = 7
          cutoff = today - timedelta(days=keep_days - 1)
          pattern = re.compile(r'^(\d{1,2})-([A-Za-z]+)-Jobs-List\.md$')

          removed = []
          for path in Path('.').glob('*-Jobs-List.md'):
              match = pattern.match(path.name)
              if not match:
                  continue
              day = int(match.group(1))
              try:
                  month = datetime.strptime(match.group(2), '%B').month
              except ValueError:
                  continue

              year = today.year
              file_date = date(year, month, day)
              if file_date > today:
                  file_date = date(year - 1, month, day)

              if file_date < cutoff:
                  path.unlink()
                  removed.append(path.name)

          print(f'Keeping job-list files from {cutoff.isoformat()} through {today.isoformat()}')
          print(f'Deleted {len(removed)} older job-list files')
          for name in sorted(removed):
              print(f'  deleted: {name}')
          PY

      - name: Commit and push updated files
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "Job Scraper Bot"
          git config --global user.email "bot@github.com"
          git add -A -- README.md seen_links.csv job_signals.json '*-Jobs-List.md' || true
          git diff --staged --quiet || git commit -m "🤖 Job update — $(date +'%Y-%m-%d %H:%M')"
          git push
