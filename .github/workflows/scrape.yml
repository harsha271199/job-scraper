name: Job Scraper — Every Hour

on:
  schedule:
    - cron: '0 * * * *'   # runs at the top of every hour
  workflow_dispatch:        # lets you trigger manually from GitHub UI
  push:
    branches:
      - main
    paths:
      - 'job_scraper.py'
      - 'official_sources.py'
      - 'run_scraper.py'
      - 'cleanup_opendoor_batch.py'
      - 'resume_tailor.py'
      - 'resume_skill_inventory.json'
      - 'RESUME_TAILOR.md'
      - 'companies.csv'
      - 'official_companies.csv'
      - 'requirements.txt'
      - 'test_job_scraper.py'
      - 'test_official_sources.py'
      - 'test_resume_tailor.py'
      - 'SETUP.md'
      - '.github/workflows/scrape.yml'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas

      - name: Run regression tests
        run: python -m unittest -v test_job_scraper.py test_official_sources.py test_resume_tailor.py

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_scraper.py

      - name: Commit and push updated files
        run: |
          git config --global user.name "Job Scraper Bot"
          git config --global user.email "bot@github.com"
          git add README.md seen_links.csv *-Jobs-List.md || true
          git diff --staged --quiet || git commit -m "🤖 Job update — $(date +'%Y-%m-%d %H:%M')"
          git push
