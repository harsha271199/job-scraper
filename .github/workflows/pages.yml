name: Deploy Resume + Apply Portal

on:
  push:
    branches:
      - main
    paths:
      - 'portal/**'
      - 'job_signals.json'
      - 'resume_skill_inventory.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install portal build dependencies
        run: npm install --prefix portal --ignore-scripts --no-audit --no-fund

      - name: Build private-browser portal
        run: |
          rm -rf _site
          mkdir -p _site
          cp portal/index.html _site/index.html
          cp portal/styles.css _site/styles.css
          cp job_signals.json _site/job_signals.json
          cp resume_skill_inventory.json _site/resume_skill_inventory.json
          ./portal/node_modules/.bin/esbuild portal/app.js \
            --bundle \
            --platform=browser \
            --format=iife \
            --target=es2020 \
            --minify \
            --outfile=_site/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
